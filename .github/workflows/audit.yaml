name: security-audit

on:
  # Run weekly — off the :00/:30 marks to reduce scheduler collisions.
  schedule:
    - cron: '13 6 * * 1'
  # Also run immediately when dependency manifests change.
  push:
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'solace-rs-sys/Cargo.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6
        with:
          toolchain: stable
          cache: false
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run security audit
        run: cargo audit
